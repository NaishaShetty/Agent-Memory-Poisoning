[pytest]
testpaths = tests
python_files = test_*.py
# P2 fix (2026-09-14): vendored, third-party dataset-candidate source trees
# (external repos checked out for reference during Phase 1 dossier work, with
# their own missing pip dependencies and their own test suites never meant to
# run as part of MAMBench's own suite) were previously swept up by any broad
# `pytest phase3/` or `pytest .` invocation -- causing real collection errors
# on missing external packages, AND silently generating __pycache__ bytecode
# under the raw, fingerprinted dataset checkout, which then desynced from its
# own committed raw_fingerprint.json manifest (the exact root cause of a real,
# previously-failing test, fixed the same day this line was added). Excluded
# from collection entirely, matching this project's own "candidates are
# reference material, not benchmark code" discipline.
norecursedirs = .* *.egg build dist CVS node_modules venv {arch} phase3/datasets/candidates phase3_reference
