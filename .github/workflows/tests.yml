name: MAMBench tests

# Added in response to external review (2026-09-28): "no CI, no single command that
# reproduces everything." SCOPE, disclosed honestly: this runs the Phases 1-16 regression
# suite, which does not require a local LLM. Most of Phase 17's own tests either need a
# local Ollama server (qwen2.5:7b, llama2, phi3:mini) or a GEMINI_API_KEY, neither of
# which is available in this hosted runner -- those tests are run in a separate,
# best-effort job that is allowed to fail (`continue-on-error`) rather than block CI,
# and a smaller set of purely-structural Phase 17 tests (no network/LLM calls) is run
# unconditionally. This is NOT yet "one command reproduces everything" -- closing that
# fully needs a self-hosted runner with Ollama installed, which is out of scope for this
# fix.
#
# GREEN AS OF 2026-09-29, PRECISELY SCOPED (external review round 3, follow-up): getting
# frozen-phases to actually pass (not just run) surfaced and fixed several real,
# previously-invisible bugs -- a .gitignore rule silently excluding real dataset files, three
# frozen fingerprints computed against Windows-CRLF content instead of the true committed
# bytes, and actions/checkout not fetching this repo's git-lfs content. `frozen-phases`
# passing means: a fresh clone installs correctly and the frozen Phases 1-16 logic +
# Phase 17's structural tests hold on that clean checkout. It does NOT mean any
# LLM-dependent Phase 17 result was re-verified -- 302 tests are auto-skipped by the root
# `conftest.py` because this runner has neither the real raw datasets (gitignored for
# licensing) nor Ollama nor the isolated foundation environments those results depend on.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frozen-phases:
    runs-on: ubuntu-latest
    steps:
      # CORRECTION (external review round 3, follow-up, 2026-09-28): the FIRST real CI run
      # of this job (after the pandas/jsonschema fix let it get this far) showed
      # `actions/checkout@v4` without `lfs: true` leaves this repo's git-lfs-tracked file
      # (phase3/datasets/candidates/memoryagentbench/normalized/memory_records.jsonl, see
      # .gitattributes) as an unresolved LFS pointer on the runner, not its real content --
      # causing digest-mismatch and JSON-parse failures in every test that reads it or a
      # frozen fingerprint derived from it. Added `lfs: true`.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Phases 1-16 regression (no local LLM required)
        # A real, fresh CI checkout also lacks: (1) real, licensed raw dataset files
        # deliberately excluded from git for licensing (data/raw/, data/processed/ -- see
        # .gitignore), and (2) a cached/downloadable embedding or cross-encoder model when
        # this runner cannot reach huggingface.co. `conftest.py` at the repo root
        # auto-skips (does not fail) any test that hits exactly these known, external
        # causes, so this job still gates everything that only depends on this repo's own
        # committed code and data.
        run: >
          python -m pytest phase6/ phase8/ phase11/ phase12/ phase13/ phase14/ phase15/
          attribution/ phase7/ phase3/ -m "not slow" -q

  phase17-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Phase 17 tests that need no local LLM/API key
        # CORRECTION (external review round 2, 2026-09-28): this step previously ended in
        # `|| true`, which made it succeed unconditionally regardless of test failures --
        # a CI job that can never fail is not a real gate. Removed. It also omitted the two
        # newest test files (headline-number and live-foundation-stage regression guards);
        # added. This has never actually run in CI yet (nothing has been pushed since it
        # was added), so it is unverified against a clean runner until the next push.
        run: >
          python -m pytest
          phase17/tests/test_workstreams.py
          phase17/tests/test_bench_runner.py
          phase17/tests/test_external_review_fixes.py
          phase17/tests/test_headline_numbers.py
          phase17/tests/test_live_foundation_stages.py
          phase17/tests/test_round3_fixes.py
          phase17/tests/test_arenas.py
          phase17/leakage_audit.py
          -q

  phase17-full-best-effort:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Attempt full Phase 17 suite (expected to fail without a local Ollama server)
        run: python -m pytest phase17/ -m "not slow" -q
