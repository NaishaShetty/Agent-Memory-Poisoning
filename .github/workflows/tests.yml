name: MAMBench tests

# Scope (revised 2026-10-18, unified-benchmark and CI audit). Every job is a gate; there is
# no allowed-to-fail job any more. What a hosted runner can and cannot check:
#
#   * No Ollama server and no GEMINI_API_KEY: OLLAMA_BASE_URL points at a closed port so no
#     test or benchmark task can silently call a live model. LLM-judge decisions come from the
#     committed caches; benchmark results record this as judge_source=cache_only.
#   * No licensed raw data (data/raw/, data/processed/ are gitignored for licensing). Tests
#     that need it are skipped explicitly (@pytest.mark.requires_licensed_data) or by the root
#     conftest.py; the number of conftest auto-skips per job is held to a budget
#     (scripts/ci/autoskip_budget.json) so a new hidden failure cannot pass as a skip.
#   * No isolated A-MEM/Mem0 interpreter: those benchmark tasks report BLOCKED, never success.
#
# History: the first version (2026-09-28) ran only part of Phases 3-16 and a hand-picked list
# of 9 Phase 17 test files, ran the rest of Phase 17 in a continue-on-error job, skipped
# phase4/, phase5/ and tests/ entirely, and triggered only on main.

on:
  push:
    branches: [main, "remediation/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  OLLAMA_BASE_URL: "http://127.0.0.1:9"

jobs:
  validate:
    name: environment, syntax and registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies (hashed Linux lock)
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Check installed dependencies are consistent
        run: pip check
      - name: Byte-compile project sources (syntax errors fail here)
        run: >
          python -m compileall -q -x "datasets.candidates|phase3_reference|archive"
          attribution mambench phase3 phase4 phase5 phase6 phase7 phase8 phase11 phase12
          phase13 phase14 phase15 phase17 preprocessing scripts tests
      - name: Validate the benchmark registry
        run: python -m mambench validate
      - name: Record resolved dependency versions
        run: pip freeze > pip-freeze.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-freeze-${{ github.sha }}
          path: pip-freeze.txt
          retention-days: 30

  frozen-phases:
    name: Phases 1-16 and attribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies (hashed Linux lock)
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Run the frozen-phase suites
        env:
          MAMBENCH_AUTOSKIP_REPORT: ${{ runner.temp }}/autoskip.json
        run: >
          python -m pytest phase3/ phase4/ phase5/ phase6/ phase7/ phase8/ phase11/ phase12/
          phase13/ phase14/ phase15/ attribution/ tests/ -m "not slow" -q -rs
      - name: Hold conftest auto-skips to their budget
        run: python scripts/ci/check_autoskip_budget.py "${{ runner.temp }}/autoskip.json" frozen-phases

  phase17:
    name: Phase 17 (cached judges, no live model)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies (hashed Linux lock)
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Run the Phase 17 suite
        env:
          MAMBENCH_AUTOSKIP_REPORT: ${{ runner.temp }}/autoskip.json
        run: python -m pytest phase17/ -m "not slow" -q -rs
      - name: Hold conftest auto-skips to their budget
        run: python scripts/ci/check_autoskip_budget.py "${{ runner.temp }}/autoskip.json" phase17

  benchmark:
    name: unified benchmark (tests and smoke run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies (hashed Linux lock)
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Benchmark registry, schema and failure-path tests
        run: python -m pytest mambench/tests -q
      - name: Smoke run (fails on FAILED, BLOCKED or NOT_EVALUABLE)
        run: python -m mambench run --smoke --strict --out "${{ runner.temp }}/mambench_results"
      - name: Check the run left tracked files untouched
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mambench-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mambench_results
          retention-days: 30

  licensed-data:
    name: held-out splits and leakage checks (LoCoMo, pinned and verified)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies (hashed Linux lock)
        run: pip install --require-hashes -r requirements-ci.txt
      # LoCoMo (CC BY-NC 4.0) is fetched for this run only, from pinned upstream commits, and must
      # match the sha256 in data/metadata/dataset_manifest.json; it is never committed. The full
      # four-check leakage audit also needs the processed LongMemEval/MSC/Conversation Chronicles
      # corpora (MSC is never fetched: no explicit licence), so it stays BLOCKED here by design.
      - name: Fetch licensed data (pinned, digest-verified)
        run: python scripts/ci/fetch_licensed_data.py
      # The embedding modules load models offline by design and fail if they are not cached; a
      # fresh runner's cache is empty, so the two models are fetched here and checked against
      # their pinned commits.
      - name: Prefetch embedding models (pinned commits)
        run: python scripts/ci/prefetch_models.py
      - name: Held-out split evaluations and LoCoMo-only leakage checks
        run: >
          python -m mambench run --strict --out "${{ runner.temp }}/mambench_licensed"
          --task defence.held_out_novel.B9 --task defence.held_out_novel.B12
          --task defence.held_out_regen.B12 --task defence.held_out_evasion.B12
          --task integrity.leakage_text_and_metadata
      - name: Benchmark-runner reproduction tests
        run: python -m pytest phase17/tests/test_bench_runner.py -q -rs
      - name: Check the run left tracked files untouched
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mambench-licensed-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mambench_licensed
          retention-days: 30
